<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B28 Bautagebuch</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f1f0eb">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
/* Layout: Bautagebuch – grosses neuestes Foto als Kopf, darunter Einträge als Zeitleiste nach Kalenderwoche */
@font-face { font-family: "Josefin Sans"; font-weight: 200; font-display: swap; src: url("../fonts/josefin-sans-latin-200-normal.woff2") format("woff2"); }
@font-face { font-family: "Josefin Sans"; font-weight: 300; font-display: swap; src: url("../fonts/josefin-sans-latin-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 400; font-display: swap; src: url("../fonts/manrope-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 500; font-display: swap; src: url("../fonts/manrope-latin-500-normal.woff2") format("woff2"); }

:root {
  --bg: #f1f0eb;
  --panel: #e3e1d9;
  --fg: #23251f;
  --muted: #6b6d63;
  --line: #d5d3c9;
  --accent: #5b6b35;
  --accent-light: #c8d39e;
  --accent-soft: rgba(91,107,53,.10);
  --on-photo: #f4f3ee;
  --f-display: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
  --f-body: "Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; }

/* Kopfleiste */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) 16px; }
.brand { font-family: var(--f-display); font-weight: 300; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.rapport {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font-size: 13px; color: var(--fg); padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
  transition: border-color .2s, background .2s; white-space: nowrap;
}
.rapport:hover { border-color: var(--accent); background: var(--accent-soft); }
.rapport svg { width: 14px; height: 14px; color: var(--accent); flex: none; }

/* Hero: neuestes Foto */
.hero { position: relative; border-radius: 8px; overflow: hidden; background: var(--panel); }
.hero button { all: unset; display: block; width: 100%; cursor: zoom-in; }
.hero img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.hero .over {
  position: absolute; inset: auto 0 0 0; padding: 60px 24px 22px;
  background: linear-gradient(to top, rgba(28,30,22,.82), rgba(28,30,22,0));
  pointer-events: none;
}
.hero h1 { color: var(--on-photo); margin: 0; font-family: var(--f-display); font-weight: 200; font-size: clamp(44px, 10vw, 84px); line-height: .95; letter-spacing: .04em; }
.hero .sub { margin-top: 6px; font-size: 14px; color: var(--on-photo); }
.hero .sub b { font-weight: 500; color: var(--accent-light); }

.facts { display: flex; flex-wrap: wrap; gap: 6px 26px; padding-block: 16px 0; color: var(--muted); font-size: 13px; }
.facts b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

h2 { margin: 0 0 18px; font-family: var(--f-display); font-weight: 300; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
section { margin-top: 52px; }

/* Webcam */
.cam img { border-radius: 8px; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--panel); }
.cam p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

/* Zeitleiste */
.log { list-style: none; margin: 0; padding: 0; }
.entry { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 0 28px; position: relative; padding-bottom: 36px; }
.entry::before { content: ""; position: absolute; left: 112px; top: 8px; bottom: 0; width: 1px; background: var(--line); transform: translateX(14px); }
.entry:last-child::before { bottom: auto; height: 0; }
.entry::after { content: ""; position: absolute; left: 112px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--accent); transform: translateX(10px); }
.when { text-align: right; padding-top: 2px; }
.when .kw { font-family: var(--f-display); font-weight: 300; font-size: 12px; letter-spacing: .2em; color: var(--accent); }
.when .d { font-size: 14px; font-variant-numeric: tabular-nums; }
.when .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.body { padding-left: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.body button { all: unset; cursor: zoom-in; display: block; border-radius: 6px; overflow: hidden; background: var(--panel); max-width: 560px; }
.body img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transition: opacity .2s; }
.body button:hover img { opacity: .88; }
.body p { margin: 0; font-size: 16px; overflow-wrap: anywhere; max-width: 60ch; }
.empty { padding: 28px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
.demo { display: inline-block; font-size: 12px; color: var(--bg); background: var(--accent); padding: 5px 12px; border-radius: 999px; margin-top: 14px; }

button:focus-visible, .rapport:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Lightbox */
.lb { position: fixed; inset: 0; background: rgba(241,240,235,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.lb img { max-height: 78vh; width: auto; max-width: 100%; border-radius: 4px; }
.lb .cap { text-align: center; }
.lb .cap span { color: var(--accent); font-size: 13px; margin-right: 10px; }
.lb .nav { display: flex; gap: 10px; }
.lb button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
.lb button:hover { border-color: var(--accent); background: var(--accent-soft); }

footer { margin-top: 40px; padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }

@media (max-width: 600px) {
  .hero img { aspect-ratio: 4 / 5; }
  .hero .over { padding: 50px 18px 18px; }
  .entry { grid-template-columns: minmax(0, 1fr); padding-left: 24px; }
  .entry::before { left: 4px; transform: none; top: 10px; }
  .entry::after { left: 0; transform: none; }
  .when { text-align: left; display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  .body { padding-left: 0; }
  .rapport .long { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">B28 <span>Bautagebuch</span></div>
    <a class="rapport" href="https://forms.cloud.microsoft/e/qUuvbVUhx9" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span>Arbeitsrapport<span class="long"> erfassen</span></span>
    </a>
  </header>

  <div class="hero" id="hero">
    <button type="button" id="hero-btn"><img id="hero-img" alt=""></button>
    <div class="over">
      <h1>B28</h1>
      <div class="sub" id="hero-sub">Unser Hausbau</div>
    </div>
  </div>
  <div class="facts" id="facts"></div>
  <span class="demo" id="demo" hidden>Vorschau mit Beispielbildern</span>

  <section id="cam-sec" hidden aria-labelledby="h-cam">
    <h2 id="h-cam">Baustelle heute</h2>
    <div class="cam"><img id="cam" alt="Aktuelles Bild der Baustellenkamera"><p>Wird automatisch aktualisiert.</p></div>
  </section>

  <section aria-labelledby="h-log">
    <h2 id="h-log">Einträge</h2>
    <ol class="log" id="log"><li class="empty">Bilder werden geladen …</li></ol>
  </section>

  <footer>
    <span>Private Seite · Link bitte nur in der Familie weitergeben</span>
    <a class="rapport" href="https://forms.cloud.microsoft/e/qUuvbVUhx9" target="_blank" rel="noopener noreferrer">Arbeitsrapport erfassen</a>
  </footer>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Bildansicht">
  <img id="lb-img" alt="">
  <div class="cap"><span id="lb-when"></span><span id="lb-what" style="color:var(--fg);font-size:16px"></span></div>
  <div class="nav">
    <button type="button" id="lb-prev">← Älter</button>
    <button type="button" id="lb-close">Schliessen</button>
    <button type="button" id="lb-next">Neuer →</button>
  </div>
</div>

<script>
(function () {
  // ---------- Einstellungen ----------
  var REPO = '360gradAtelier/website';
  var FOLDER = 'b28/fotos';
  // -----------------------------------

  var LIVE = /(^|\.)360gradatelier\.ch$/i.test(location.hostname) || /github\.io$/i.test(location.hostname);
  var MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var today = new Date(); today.setHours(0,0,0,0);
  var photos = [];

  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmt(d) { return d ? d.getDate() + '. ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : ''; }
  var SHORT = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
  function short(d) { return d ? d.getDate() + '. ' + SHORT[d.getMonth()] + ' ' + d.getFullYear() : ''; }
  function kw(d) { var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); var y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 86400000 + 1) / 7); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function toPhoto(name, url) {
    var base = name.replace(/\.[^.]+$/, '');
    return { name: name, url: url, date: parseDate(base), text: base.replace(/^\d{4}-\d{2}-\d{2}[ _-]*/, '').replace(/_/g, ' ').trim() };
  }

  function render() {
    photos.sort(function (a, b) { return (b.date || 0) - (a.date || 0) || (a.name < b.name ? 1 : -1); });
    var log = document.getElementById('log'); log.textContent = '';
    var facts = document.getElementById('facts'); facts.textContent = '';
    if (!photos.length) {
      document.getElementById('hero').hidden = true;
      log.appendChild(el('li', 'empty', 'Noch keine Einträge. Das erste Foto folgt bald.'));
      return;
    }
    var p0 = photos[0];
    var hi = document.getElementById('hero-img'); hi.src = p0.url; hi.alt = p0.text || 'Neuestes Baustellenfoto';
    document.getElementById('hero-btn').onclick = function () { openLb(0); };
    var sub = document.getElementById('hero-sub'); sub.textContent = '';
    if (p0.date) { var b = el('b', null, fmt(p0.date)); sub.appendChild(b); sub.appendChild(document.createTextNode(p0.text ? ' · ' + p0.text : '')); }
    else sub.textContent = p0.text;

    var dated = photos.filter(function (p) { return p.date; });
    var first = dated.length ? dated[dated.length - 1].date : null;
    if (first) addFact('Tag ' + (Math.round((today - first) / 86400000) + 1), 'seit ' + fmt(first));
    addFact(String(photos.length), photos.length === 1 ? 'Eintrag' : 'Einträge');
    function addFact(v, l) { var s = el('span'); s.appendChild(el('b', null, v)); s.appendChild(document.createTextNode(' ' + l)); facts.appendChild(s); }

    photos.forEach(function (p, i) {
      var li = el('li', 'entry');
      var w = el('div', 'when');
      if (p.date) { w.appendChild(el('div', 'kw', 'KW ' + kw(p.date))); w.appendChild(el('div', 'd', short(p.date))); }
      w.appendChild(el('div', 'n', 'Nr. ' + (photos.length - i)));
      var bd = el('div', 'body');
      var btn = el('button'); btn.type = 'button';
      var im = el('img'); im.loading = 'lazy'; im.src = p.url; im.alt = p.text || 'Baustellenfoto';
      btn.appendChild(im); btn.onclick = function () { openLb(i); };
      bd.appendChild(btn);
      if (p.text) bd.appendChild(el('p', null, p.text));
      li.appendChild(w); li.appendChild(bd); log.appendChild(li);
    });
  }

  // Lightbox
  var cur = 0, lb = document.getElementById('lb');
  function openLb(i) {
    cur = (i + photos.length) % photos.length; var p = photos[cur];
    var im = document.getElementById('lb-img'); im.src = p.url; im.alt = p.text || 'Baustellenfoto';
    document.getElementById('lb-when').textContent = fmt(p.date);
    document.getElementById('lb-what').textContent = p.text;
    lb.hidden = false; document.getElementById('lb-close').focus();
  }
  function closeLb() { lb.hidden = true; }
  document.getElementById('lb-close').onclick = closeLb;
  document.getElementById('lb-prev').onclick = function () { openLb(cur + 1); };
  document.getElementById('lb-next').onclick = function () { openLb(cur - 1); };
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') openLb(cur + 1);
    if (e.key === 'ArrowRight') openLb(cur - 1);
  });

  // Webcam (erscheint nur, wenn b28/webcam.jpg existiert)
  var cam = document.getElementById('cam');
  cam.onload = function () { document.getElementById('cam-sec').hidden = false; };
  if (LIVE) cam.src = 'webcam.jpg?t=' + Date.now();

  if (LIVE) {
    fetch('https://api.github.com/repos/' + REPO + '/contents/' + FOLDER)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (list) {
        photos = list.filter(function (f) { return f.type === 'file' && /\.(jpe?g|png|webp)$/i.test(f.name); })
          .map(function (f) { return toPhoto(f.name, 'fotos/' + encodeURIComponent(f.name)); });
        render();
      })
      .catch(function () {
        document.getElementById('hero').hidden = true;
        var log = document.getElementById('log'); log.textContent = '';
        log.appendChild(el('li', 'empty', 'Die Bilder konnten gerade nicht geladen werden. Bitte in ein paar Minuten nochmals versuchen.'));
      });
  } else {
    document.getElementById('demo').hidden = false;
    var demo = [['2026-09-28','Dachziegel sind drauf','#8a9168'],['2026-09-18','Dach dicht, der Aufrichtebaum steht','#9a9a86'],['2026-08-02','Obergeschoss gemauert','#7d826a'],['2026-07-10','Aufrichtefest mit der ganzen Familie','#a3a585'],['2026-05-04','Bodenplatte betoniert','#8e8d80'],['2026-03-16','Spatenstich','#7b7e6c']];
    photos = demo.map(function (x) {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + x[2] + '"/><stop offset="1" stop-color="#4a4d40"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><text x="400" y="310" text-anchor="middle" font-family="Arial" font-size="26" fill="#f1f0eb" opacity=".8">Beispielbild</text></svg>';
      return toPhoto(x[0] + ' ' + x[1] + '.jpg', 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
    });
    render();
  }
})();
</script>
</body>
</html>
